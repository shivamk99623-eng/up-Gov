services:
  up-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: up-dashboard
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UP_PROJECT_ROOT: /app
      UP_DB_POOL_SIZE: "2"
    # RW mount required: SQLite WAL needs to create -shm/-wal beside data.db.
    # App still blocks writes with PRAGMA query_only=ON.
    volumes:
      - ./database:/app/database
    restart: unless-stopped
