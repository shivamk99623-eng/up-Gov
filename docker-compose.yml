services:
  up-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: up-dashboard
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UP_PROJECT_ROOT: /app
    restart: unless-stopped
    # Optional: persist or override the SQLite DB from the host
    # volumes:
    #   - ./database/data.db:/app/database/data.db:ro
